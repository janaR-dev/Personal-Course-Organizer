<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Academy</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="container">
            <nav class="navBar">
                <div class="name">
                    <div class="logo">
                        <img src="images/logo.png" alt="">
                        <div class="title">
                            <h2><span style="color: rgb(212, 5, 122);">Excel</span> Academy</h2>
                        </div>
                    </div>
                </div>


                <div class="menu">
                    <button>
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <div class="list">
                        <ul>
                            <li><a href="index.html">Home</a></li>
                            <li><a href="Mycourses.html">My Courses</a></li>
                            <li><a href="AddCourse.html">Add Course</a></li>
                            <li><a href="ContactUs.html">Contact Us</a></li>
                        </ul>
                    </div>

                </div>
            </nav>

        </div>

    </header>
    <section class="" id="AddCourse">
        <div class="container">
            <h2>Add More Courses</h2>
            <img src="images/add.png" alt="">
            <form action="#">
                <div class="courses">
                    <label for="Course">Course Name:</label>
                    <input type="text" name="Course" id="Course" placeholder="Add Course name">
                    <label for="Lecturer">Lecturer Name:</label>
                    <input type="text" name="Lecturer" id="Lecturer" placeholder="Add Lecturer name">
                    <label for="Credit">Course Hours:</label>
                    <input type="number" min="0" max="5" placeholder="Add Credit Hours" name="Credit" id="Credit">
                    <label>Add Notes</label>
                    <textarea name="note" id="note" rows="4" cols="50"></textarea>


                </div>
                <button type="submit">Submit</button>
            </form>
        </div>

    </section>
    <footer>Jana Ramadan 2026 Personal Course Organizer</footer>

</body>

</html>
