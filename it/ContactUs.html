<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Academy</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="container">
            <nav class="navBar">
                <div class="name">
                    <div class="logo">
                        <img src="images/logo.png" alt="">
                        <div class="title">
                            <h2><span style="color: rgb(212, 5, 122);">Excel</span> Academy</h2>
                        </div>
                    </div>
                </div>


                <div class="menu">
                    <button>
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <div class="list">
                        <ul>
                            <li><a href="index.html">Home</a></li>
                            <li><a href="Mycourses.html">My Courses</a></li>
                            <li><a href="AddCourse.html">Add Course</a></li>
                            <li><a href="ContactUs.html">Contact Us</a></li>
                        </ul>
                    </div>

                </div>
            </nav>

        </div>

    </header>
    <section class="" id="ContactUs">

        <div class="container">
            <h2>Contact Us</h2>
            <p>Have questions about the website? Our team is here to help.</p>
            <img src="images/heart.png" alt="">

            <div class="contact">
                <div class="contact-form">
                    <form action="#">
                        <div class="contact">
                            <label for="Name">Name:</label>
                            <input type="text" id="Name" name="Name" placeholder="Full Name" required>
                            <label for="email">Your Email:</label>
                            <input type="email" id="email" name="email" placeholder="Email Address" required>
                            <label for="message">Leave Message:</label>
                            <textarea id="message" name="message" placeholder="Your Message" rows="5"></textarea>
                        </div>
                        <button type="submit" class="btn-submit">Send</button>
                    </form>
                </div>


            </div>
        </div>

    </section>
    <footer>Jana Ramadan 2026 Personal Course Organizer</footer>

</body>

</html>
